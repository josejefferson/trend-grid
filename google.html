<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Trends - Trend Grid</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>

  <body>
    <iframe
      src="https://trend-grid.vercel.app/trends/"
      id="trends"
      frameborder="0"
      style="width: 480px; height: 270px"
      allowfullscreen
    ></iframe>

    <script>
      const trends = document.getElementById('trends')

      window.addEventListener('message', async ({ data }) => {
        if (!Array.isArray(data)) return
        const [command, content] = data
        if (command !== 'fetch-trends') return
        trends.contentWindow.postMessage(['data', await fetchData()], '*')
      })

      async function fetchData() {
        const response = await fetch('/api/google-trends')
        return await response.json()
      }
    </script>

    <script type="module" src="/js/index.js"></script>
  </body>
</html>
